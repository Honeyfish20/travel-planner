<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程规划 · 多 Agent（商务 / 家庭游 / 入境游）</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#5b6472; --brand:#1d4ed8; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --line:#e3e7ee; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  header { background:#1e3a8a; color:#fff; padding:16px 28px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.85; }
  main { max-width:1320px; margin:0 auto; padding:20px; display:grid; grid-template-columns:360px 1fr; gap:20px; align-items:start; }
  @media (max-width:960px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .card h3 { font-size:14px; margin:14px 0 6px; }
  label { font-weight:600; font-size:13px; display:block; margin:8px 0 4px; }
  textarea, input[type=text], select { width:100%; padding:8px 10px; border:1px solid #c9d0db; border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:110px; resize:vertical; }
  textarea:focus, input:focus, select:focus, button:focus-visible, summary:focus-visible { outline:3px solid #93c5fd; outline-offset:1px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .row > .shrink { flex:none; }
  button { font:inherit; cursor:pointer; }
  .btn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-weight:600; }
  .btn.full { width:100%; margin-top:10px; }
  .btn.ghost { background:#fff; color:var(--brand); border:1px solid #c7d2fe; }
  .btn:disabled { opacity:.55; cursor:progress; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { background:#eef2ff; color:#312e81; border:1px solid #c7d2fe; border-radius:8px; padding:4px 8px; font-size:12px; text-align:left; }
  .chip b { color:#1e3a8a; }
  .steps { list-style:none; margin:0; padding:0; }
  .steps li { display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .steps li:last-child { border-bottom:0; }
  .dot { width:12px; height:12px; border-radius:50%; background:#cbd2dc; margin-top:5px; flex:none; }
  .running .dot { background:var(--brand); animation:pulse 1s infinite; }
  .done .dot { background:var(--ok); }
  .skipped .dot { background:#e5e7eb; border:2px dashed #9ca3af; }
  .error .dot { background:var(--bad); }
  @keyframes pulse { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .running .dot { animation:none; } }
  .step-name { font-weight:600; font-size:14px; }
  .kind { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:4px; font-weight:400; }
  .step-sub { color:var(--muted); font-size:12px; }
  .muted { color:var(--muted); font-size:13px; }
  .alert { border-radius:8px; padding:10px 12px; margin-bottom:16px; font-size:14px; }
  .alert.bad { background:#fef2f2; color:var(--bad); border:1px solid #fecaca; }
  .alert.warn { background:#fffbeb; color:var(--warn); border:1px solid #fde68a; }
  .alert.ok { background:#f0fdf4; color:var(--ok); border:1px solid #bbf7d0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media (max-width:760px) { .grid2 { grid-template-columns:1fr; } }
  .grid2 > .card { margin-bottom:0; }
  .badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; margin:0 4px 4px 0; font-weight:600; }
  .badge.ok { background:#dcfce7; color:var(--ok); }
  .badge.warn { background:#fef3c7; color:var(--warn); }
  .badge.bad { background:#fee2e2; color:var(--bad); }
  .badge.neutral { background:#e0e7ff; color:#3730a3; }
  .badge.gray { background:#f1f5f9; color:#475569; }
  .option { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .option-head { display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .price { font-weight:700; color:var(--brand); margin-top:4px; }
  .reason { background:#f8fafc; border-left:3px solid var(--brand); padding:6px 10px; font-size:13px; color:var(--muted); margin:8px 0 0; white-space:pre-wrap; }
  dl.kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0 0 10px; font-size:14px; }
  dl.kv dt { color:var(--muted); }
  dl.kv dd { margin:0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  caption { text-align:left; font-size:12px; color:var(--muted); padding-bottom:6px; }
  th, td { text-align:left; padding:6px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  tr.total td { font-weight:700; border-bottom:0; }
  ul.plain { margin:0; padding-left:18px; font-size:14px; }
  ul.plain li { margin-bottom:4px; }
  .day-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; margin:14px 0 6px; }
  .day-head h3 { margin:0; color:#1e3a8a; }
  .timeline { list-style:none; margin:0; padding:0 0 0 14px; border-left:2px solid #c7d2fe; }
  .timeline li { position:relative; padding:4px 0 8px 12px; }
  .timeline li::before { content:""; position:absolute; left:-20px; top:10px; width:10px; height:10px; border-radius:50%; background:var(--brand); }
  .timeline li.rest::before { background:#a855f7; }
  .timeline li.meal::before { background:#f59e0b; }
  .timeline li.poi::before { background:#16a34a; }
  .time { font-variant-numeric:tabular-nums; font-weight:700; margin-right:6px; }
  .phrase { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .phrase .zh { font-size:18px; font-weight:700; }
  .phrase .en { color:var(--muted); font-size:14px; }
  details { margin-top:8px; }
  summary { cursor:pointer; font-size:13px; color:var(--brand); }
  .src { font-size:12px; color:var(--muted); }
  .src a { color:var(--brand); }
  .answer { white-space:pre-wrap; font-size:14px; margin:8px 0 0; }
  .empty { color:var(--muted); text-align:center; padding:60px 20px; }
  .share-post { white-space:pre-wrap; background:#f8fafc; border-radius:8px; padding:10px; font-size:14px; }
  .wx-day { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .wx-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; }
  .wx-head .big { font-size:22px; }
  .wx-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-top:8px; }
  @media (max-width:760px) { .wx-grid { grid-template-columns:repeat(2, 1fr); } }
  .wx-block { border-radius:6px; padding:6px 8px; font-size:12px; border:1px solid var(--line); }
  .wx-block.ok { background:#f0fdf4; border-color:#bbf7d0; }
  .wx-block.bad { background:#fffbeb; border-color:#fde68a; }
  .wx-block b { display:block; font-size:13px; }
  .wx-chip { display:inline-block; font-size:11px; color:#334155; background:#f1f5f9; border-radius:4px; padding:0 5px; margin-left:4px; }
  .wx-chip.bad { background:#fef3c7; color:var(--warn); }
  .coupon { border:1px dashed #f59e0b; background:#fffbeb; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .coupon.off { border-color:#cbd5e1; background:#f8fafc; color:var(--muted); }
  .coupon code { font-weight:700; background:#fff; border:1px solid #fde68a; padding:0 6px; border-radius:4px; }
  .hot { display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); }
  .hot:last-child { border-bottom:0; }
  .hot .rank { flex:none; width:24px; height:24px; border-radius:50%; background:#1e3a8a; color:#fff; font-weight:700; text-align:center; line-height:24px; font-size:13px; }
  .event { border-left:3px solid #93c5fd; padding:4px 0 8px 10px; margin-bottom:6px; }
  .event .when { font-weight:700; font-size:13px; }
  header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .lang-switch { display:flex; border:1px solid rgba(255,255,255,.55); border-radius:8px; overflow:hidden; flex:none; }
  .lang-btn { background:transparent; color:#fff; border:0; padding:6px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .lang-btn[aria-pressed="true"] { background:#fff; color:#1e3a8a; }
  .lang-btn:focus-visible { outline:3px solid #93c5fd; outline-offset:-3px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="header.title">行程规划 · 多 Agent</h1>
    <p data-i18n="header.sub">商务出行 / 家庭游 / 入境游</p>
  </div>
  <div class="lang-switch" role="group" aria-label="Language / 语言">
    <button type="button" class="lang-btn" data-lang="zh" aria-pressed="true" lang="zh-CN">中文</button>
    <button type="button" class="lang-btn" data-lang="en" aria-pressed="false" lang="en">EN</button>
  </div>
</header>
<main>
  <div>
    <section class="card" aria-labelledby="plan-h">
      <h2 id="plan-h" data-i18n="plan.h">规划行程</h2>
      <form id="form">
        <label for="query" data-i18n="plan.query_label">描述你的出行需求</label>
        <textarea id="query" maxlength="1000" data-i18n-ph="plan.query_ph"></textarea>
        <label for="profile" data-i18n="plan.profile_label">家庭档案 ID</label>
        <div class="row">
          <input id="profile" type="text" maxlength="32" data-i18n-ph="plan.profile_ph" autocomplete="off">
          <button type="button" class="btn ghost shrink" id="load-profile" data-i18n="btn.view">查看</button>
          <button type="button" class="btn ghost shrink" id="del-profile" data-i18n="btn.delete">删除</button>
        </div>
        <p class="muted" id="profile-info" aria-live="polite"></p>
        <div class="chips" data-i18n-aria="chips.aria">
          <button type="button" class="chip" data-key="chip.biz"
            data-q="下周三从上海去新加坡拜访客户，周五晚上回来，1个人，预算1.5万"
            data-q-en="Next Wednesday I'm flying from Shanghai to Singapore to visit a client, back Friday evening, 1 person, budget 15000 CNY."></button>
          <button type="button" class="chip" data-key="chip.fam1" data-profile="zhang-family"
            data-q="10月24日带5岁孩子（花生过敏）和70岁奶奶（每天最多走2公里）从上海去杭州玩3天，10月26日回，节奏轻松"
            data-q-en="Oct 24 to Oct 26, Shanghai to Hangzhou with my 5-year-old (peanut allergy) and 70-year-old grandma (walks at most 2 km a day), relaxed pace."></button>
          <button type="button" class="chip" data-key="chip.fam2"
            data-q="11月1日从北京去上海玩4天，11月4日回，我们夫妻俩带1岁宝宝，需要推婴儿车"
            data-q-en="Nov 1 to Nov 4, Beijing to Shanghai, my wife and I with our 1-year-old baby in a stroller."></button>
          <button type="button" class="chip" data-key="chip.multi"
            data-q="10月30日我家（我、老婆、8岁儿子）和王家（王先生、王太太）一起从北京去西安玩3天，11月1日回，费用两家分摊"
            data-q-en="Oct 30 to Nov 1, Beijing to Xi'an: my family (me, my wife, our 8-year-old son) and the Wang family (Mr and Mrs Wang), splitting costs between the two families."></button>
          <button type="button" class="chip" data-key="chip.mem" data-profile="zhang-family"
            data-q="下个月8号全家从上海去北京玩4天，11月11日回"
            data-q-en="The whole family, Shanghai to Beijing from Nov 8 to Nov 11."></button>
          <button type="button" class="chip" data-key="chip.in1"
            data-q="I'm American. My wife and I will fly from Tokyo to Beijing on October 25 and stay 5 days, then go back to Tokyo. We are vegetarian. Budget 4000 USD."></button>
          <button type="button" class="chip" data-key="chip.in2"
            data-q="日本人の家族です。10月28日に東京から上海へ行き、4日間滞在します。夫婦と6歳の娘、娘は卵アレルギーです。"></button>
        </div>
        <button class="btn full" id="submit" type="submit" data-i18n="btn.plan">开始规划</button>
      </form>
    </section>

    <section class="card" aria-labelledby="steps-h">
      <h2 id="steps-h" data-i18n="steps.h">Agent 执行过程</h2>
      <ul class="steps" id="steps" aria-live="polite"></ul>
      <p class="muted" id="elapsed"></p>
    </section>

    <section class="card" aria-labelledby="ask-h">
      <h2 id="ask-h" data-i18n="ask.h">入境游助手</h2>
      <form id="ask-form">
        <label for="ask-q" data-i18n="ask.q_label">问题</label>
        <textarea id="ask-q" maxlength="1000" style="min-height:70px" placeholder="My Visa card was declined when binding to Alipay. What should I do?"></textarea>
        <div class="row">
          <div>
            <label for="ask-lang" data-i18n="ask.lang_label">回答语言</label>
            <select id="ask-lang"><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="zh">简体中文</option></select>
          </div>
          <button class="btn shrink" id="ask-btn" type="submit" style="margin-top:26px" data-i18n="ask.btn">提问</button>
        </div>
      </form>
      <div id="ask-out" aria-live="polite"></div>
      <p class="muted" data-i18n="ask.note"></p>
    </section>

    <section class="card" aria-labelledby="rc-h">
      <h2 id="rc-h" data-i18n="rc.h">小票识别与记账</h2>
      <label for="rc-file" data-i18n="rc.file_label">选择小票</label>
      <input id="rc-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
      <div class="row">
        <div><label for="rc-lang" data-i18n="rc.lang_label">翻译成</label>
          <select id="rc-lang"><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="zh">简体中文</option></select></div>
        <div><label for="rc-cur" data-i18n="rc.cur_label">本币</label>
          <select id="rc-cur"><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option><option>KRW</option><option>SGD</option><option>HKD</option><option>AUD</option><option>CAD</option><option>CNY</option></select></div>
      </div>
      <div id="rc-out" aria-live="polite"></div>
      <h3 data-i18n="rc.list_h">消费清单</h3>
      <div id="rc-list"></div>
      <button type="button" class="btn ghost full" id="rc-csv" disabled data-i18n="rc.csv">导出 CSV</button>
      <p class="muted" data-i18n="rc.note"></p>
    </section>
  </div>

  <div>
    <div id="notice"></div>
    <div id="result"></div>
  </div>
</main>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
